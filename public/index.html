<!doctype html>
<html lang="en" data-auth-mode="local"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Github Observatory</title><link rel="icon" href="/favicon.ico?v=0.3.1" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png?v=0.3.1"><link rel="icon" type="image/svg+xml" href="/icon.svg?v=0.3.1"><link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png?v=0.3.1"><link rel="stylesheet" href="/style.css"><script type="module" src="/app.js"></script></head>
<body class="light"><div class="shell"><header class="top"><div class="brand"><img class="mark" src="/icon.svg" alt="">Github Observatory</div><div class="top-actions"><button id="notifications" class="notification-bell" aria-label="Notifications · loading" title="Notifications" aria-haspopup="dialog" hidden><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg><span id="notification-badge" class="notification-badge" aria-hidden="true" hidden></span></button><button id="theme" aria-label="Switch to dark theme">◐</button><button id="settings" hidden>Settings</button></div></header>
<section id="locked" class="lock panel" aria-busy="true"><h1 id="session-title">Connecting…</h1><p id="session-description">Establishing your browser session.</p><form id="unlock-form" hidden><label for="unlock-key">Local unlock key</label><input id="unlock-key" type="password" autocomplete="off" spellcheck="false" required><button class="primary" type="submit">Unlock</button></form><p id="unlock-message" role="status"></p><button id="session-retry" class="primary" hidden>Retry connection</button></section>
<div id="workspace" hidden><nav aria-label="Main navigation"><button data-page="overview" class="active" aria-current="page">Overview</button><button data-page="activity">Activity</button><button data-page="collection">Logs</button></nav>
<main><div id="error" class="notice error" role="alert" hidden></div><div class="intro"><div class="overview-heading"><h1 id="page-title" tabindex="-1">Aggregate</h1><p id="scope-summary"></p></div><div class="controls"><div class="segmented" role="group" aria-label="Graph mode" title="Date ranges zoom graphs; history counts retain their full cached scope"><button data-chart-mode="totals" aria-pressed="true">Totals over history</button><button data-chart-mode="daily" aria-pressed="false">Daily activity</button></div><div class="segmented" aria-label="Date range"><button data-range="7">7d</button><button data-range="30">30d</button><button data-range="90">90d</button><button data-range="all">All</button></div><button id="sync">Sync now</button><button class="primary" id="add">+ Watch repo</button></div></div>
<section id="overview"><div class="aggregate-grid" id="aggregate" aria-label="Aggregate repository graphs"></div><div class="section-title"><div><h2>Projects</h2><p id="projects-summary"></p></div><div class="table-tools"><input class="search" id="search" type="search" autocomplete="off" maxlength="200" aria-label="Search repositories" placeholder="Find a project…"><select id="scope-filter" aria-label="Repository visibility"><option value="all">All visibility</option><option value="public">Public</option><option value="private">Private</option></select><label class="archive-filter"><input type="checkbox" id="archived"> Archived only</label><button id="sort">Sort: recent activity ↓</button><button id="repository-settings" class="settings-cog" aria-label="Repository graph settings" title="Repository graph settings" aria-haspopup="dialog"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7"><path d="m9 3-1 3-3 1-2 3 2 2-1 3 3 2 3-1 2 3 3-1 1-3 3-1 2-3-2-2 1-3-3-2-3 1-2-3Z"/><circle cx="12" cy="11" r="3"/></svg></button><button id="export">Export CSV</button></div></div><div class="project-grid" id="cards" aria-label="Project monitoring rows"></div></section>
<section id="detail" hidden></section><section id="activity" hidden aria-busy="false"><div id="activity-filters" aria-label="Activity repository filters"></div><p id="events-state" role="status" aria-live="polite"></p><div id="events" class="timeline"></div><div class="activity-actions"><button id="events-more" hidden>Load more activity</button><button id="reload-events">Refresh activity</button></div></section><section id="collection" hidden><div id="collection-content"></div><button id="reload-status">Refresh status</button></section>
</main><footer class="footer"><span id="freshness">Waiting for stored observations</span><span>Refreshes every 30 seconds · Local, persisted history</span></footer></div></div>
<dialog id="dialog" aria-labelledby="dialog-title"><div class="dialog-head"><h2 id="dialog-title"></h2><button id="close" aria-label="Close dialog">✕</button></div><div id="dialog-body"></div><p id="dialog-message" role="status"></p></dialog><div id="toast" role="status" hidden></div></body></html>
