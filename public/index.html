<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Github Observatory</title><link rel="icon" type="image/svg+xml" href="/icon.svg"><link rel="stylesheet" href="/style.css"><script type="module" src="/app.js"></script></head>
<body class="light"><div class="shell"><header class="top"><div class="brand"><svg class="mark" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 3v18h17M8 16l4-6 4 3 5-8"/></svg>Github Observatory</div><div class="top-actions"><button id="theme" aria-label="Switch to dark theme">◐</button><button id="settings" hidden>Settings</button></div></header>
<section id="locked" class="lock panel"><h1>Your local observatory</h1><p>Unlock this browser with your local unlock key.</p><form id="unlock-form"><label for="unlock-key">Local unlock key</label><input id="unlock-key" type="password" autocomplete="off" spellcheck="false" required><button class="primary" type="submit">Unlock</button></form><p id="unlock-message" role="status"></p></section>
<div id="workspace" hidden><nav aria-label="Main navigation"><button data-page="overview" class="active" aria-current="page">Overview</button><button data-page="activity">Activity</button><button data-page="collection">Collection</button></nav>
<main><div id="error" class="notice error" role="alert" hidden></div><div class="intro"><div class="overview-heading"><h1 id="page-title" tabindex="-1">Aggregate</h1><p id="scope-summary"></p></div><div class="controls"><div class="segmented" role="group" aria-label="Graph mode"><button data-chart-mode="cumulative" aria-pressed="true">Cumulative</button><button data-chart-mode="daily" aria-pressed="false">Daily</button></div><div class="segmented" aria-label="Date range"><button data-range="7">7d</button><button data-range="30">30d</button><button data-range="90">90d</button><button data-range="all">All</button></div><button id="sync">Sync now</button><button class="primary" id="add">+ Watch repo</button></div></div>
<section id="overview"><div class="aggregate-grid" id="aggregate" aria-label="Aggregate repository graphs"></div><div class="section-title"><div><h2>Projects</h2><p id="projects-summary"></p></div><div class="table-tools"><input class="search" id="search" type="search" autocomplete="off" aria-label="Search repositories" placeholder="Find a project…"><select id="scope-filter" aria-label="Repository visibility"><option value="all">All visibility</option><option value="public">Public</option><option value="private">Private</option></select><label class="archive-filter"><input type="checkbox" id="archived"> Archived only</label><button id="sort">Sort: name</button><button id="export">Export CSV</button></div></div><div class="project-grid" id="cards" aria-label="Project monitoring rows"></div></section>
<section id="detail" hidden></section><section id="activity" hidden><div id="events" class="timeline"></div><button id="reload-events">Refresh activity</button></section><section id="collection" hidden><div id="collection-content"></div><button id="reload-status">Refresh status</button></section>
</main><footer class="footer"><span id="freshness">Waiting for stored observations</span><span>Refreshes every 30 seconds · Local, persisted history</span></footer></div></div>
<dialog id="dialog" aria-labelledby="dialog-title"><div class="dialog-head"><h2 id="dialog-title"></h2><button id="close" aria-label="Close dialog">✕</button></div><div id="dialog-body"></div><p id="dialog-message" role="status"></p></dialog><div id="toast" role="status" hidden></div></body></html>
